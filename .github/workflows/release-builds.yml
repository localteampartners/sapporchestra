name: release-builds

# WINDOWS ONLY (mac jobs removed 2026-08-08). Builds VST3/Standalone for
# Windows, and attaches the zips to the GitHub release for the given tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach builds to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:

  windows:
    runs-on: ${{ vars.WINDOWS_RUNNER || 'windows-latest' }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Version guard (CMake version must match the tag)
        shell: powershell
        run: |
          # The in-plugin updater compares the BUILT version against the latest
          # GitHub tag. If CMakeLists.txt lags the tag, every install re-offers
          # the same update forever. Fail the release before that ships.
          $tag = if ($env:TAG) { $env:TAG } else { $env:GITHUB_REF_NAME }
          if ($tag -notmatch '^v[0-9]') {
            Write-Host "not a version tag ($tag) - skipping version guard"
            exit 0
          }
          $expected = $tag -replace '^v', ''
          $m = [regex]::Match((Get-Content CMakeLists.txt -Raw),
                              'project\s*\(\s*\S+\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)')
          if (-not $m.Success) {
            Write-Host "::error::could not read project(... VERSION ...) from CMakeLists.txt"
            exit 1
          }
          $actual = $m.Groups[1].Value
          if ($actual -ne $expected) {
            Write-Host "::error::CMake version $actual does not match release tag $tag. Set project(... VERSION $expected) in CMakeLists.txt, commit, then move the tag onto that commit."
            exit 1
          }
          Write-Host "OK: CMake version $actual matches tag $tag"
      - name: Configure
        run: cmake -S . -B build -DSAPPORCHESTRA_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        shell: powershell
        run: |
          $art = "build/SappOrchestraPlugin_artefacts/Release"
          $stage = "SappOrchestra-$env:TAG-Windows-x64"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -Recurse "$art/VST3/SappOrchestra.vst3" "$stage/"
          Copy-Item "$art/Standalone/SappOrchestra.exe" "$stage/"
          # The CLI and the headless harness are the UNATTENDED entry points
          # (issue #1): a station box has no editor, so the only ways to build
          # or refresh the SFZ index are one of these binaries or the
          # SAPP_SFZ_RESCAN env var. Shipping them is not optional - the
          # release fails if the build did not produce them.
          $cli = Get-ChildItem -Path build -Recurse -Filter sapporchestra.exe |
                 Select-Object -First 1
          if (-not $cli) {
            Write-Host "::error::sapporchestra.exe (agent CLI) was not built - the release would ship with no headless SFZ index tool"
            exit 1
          }
          Copy-Item $cli.FullName "$stage/"
          $headless = Get-ChildItem -Path build -Recurse -Filter sapporchestra-headless.exe |
                      Select-Object -First 1
          if (-not $headless) {
            Write-Host "::error::sapporchestra-headless.exe was not built - the release would ship with no station harness"
            exit 1
          }
          Copy-Item $headless.FullName "$stage/"
          Set-Content -Path "$stage/INSTALL.txt" -Value @(
            'SappOrchestra - Windows x64',
            '',
            '1. Copy the SappOrchestra.vst3 folder to: C:\Program Files\Common Files\VST3\',
            '2. SappOrchestra.exe is the standalone version - run it from anywhere.',
            'Then rescan plugins in your DAW.',
            '',
            'HEADLESS / STATION BOXES (no editor is ever opened):',
            '  Rebuild the SFZ index after installing or adding libraries:',
            '    sapporchestra-headless.exe index --rescan --root D:\Samples',
            '  or set SAPP_SFZ_RESCAN=1 for one run of the host - the plugin then',
            '  rebuilds the index itself at instantiation.',
            '  Poll the read-only libraryReady parameter instead of guessing a',
            '  settle time. The plugin logs SappOrchestra-audio-source lines',
            '  naming whatever actually sounded (SAPP_ORCHESTRA_LOG=<file>).'
          )
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
      - name: Upload to release
        shell: powershell
        run: |
          # gh writes "release not found" to stderr, and Windows PowerShell turns
          # native stderr into a terminating error under ErrorActionPreference=Stop
          # (pwsh 7 on hosted runners does not) - so soften it around the probe.
          $ErrorActionPreference = "Continue"
          gh release view "$env:TAG" 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { gh release create "$env:TAG" --generate-notes }
          $ErrorActionPreference = "Stop"
          gh release upload "$env:TAG" "SappOrchestra-$env:TAG-Windows-x64.zip" --clobber

  # THE GUARD. sapptune v0.28.0 once shipped with no plugin: the build passed,
  # a later step failed, the upload was skipped, and the release looked green.
  # A tag must never exist without its binary.
  verify-release-assets:
    needs: windows
    if: always() && (inputs.tag != '' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ${{ vars.WINDOWS_RUNNER || 'windows-latest' }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: The release must carry its build
        shell: powershell
        run: |
          # bash on the self-hosted runner resolves to the WSL stub (no distro,
          # instant exit 1, script never runs) - PowerShell is the one shell
          # proven on that machine.
          $ErrorActionPreference = "Continue"
          $assets = gh release view "$env:TAG" -R "$env:GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | join(\" \")' 2>$null
          $ErrorActionPreference = "Stop"
          if (-not $assets) { $assets = "<none>" }
          Write-Output "assets on $($env:TAG): $assets"
          if ("$assets" -like "*Windows-x64*") {
            Write-Output "OK - the build is attached."
          } else {
            Write-Output "::error::$($env:TAG) has no Windows-x64 asset - the build or upload did not complete. Re-run with: gh workflow run -f tag=$($env:TAG)"
            exit 1
          }
